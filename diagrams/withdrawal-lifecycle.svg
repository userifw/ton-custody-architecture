<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400"><style>text{font-family:Arial;fill:#111827}.t{font-size:21px;font-weight:bold}.s{font-size:14px}.b{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2}</style><text x="45" y="45" class="t">Withdrawal Lifecycle</text><g class="b"><rect x="45" y="130" width="160" height="70" rx="10"/><rect x="255" y="130" width="160" height="70" rx="10"/><rect x="465" y="130" width="160" height="70" rx="10"/><rect x="675" y="130" width="160" height="70" rx="10"/><rect x="885" y="130" width="160" height="70" rx="10"/></g><text x="125" y="160" text-anchor="middle" class="t">Request</text><text x="125" y="183" text-anchor="middle" class="s">idempotent identity</text><text x="335" y="160" text-anchor="middle" class="t">Validate</text><text x="335" y="183" text-anchor="middle" class="s">policy + balance</text><text x="545" y="160" text-anchor="middle" class="t">Reserve</text><text x="545" y="183" text-anchor="middle" class="s">atomic amount</text><text x="755" y="160" text-anchor="middle" class="t">Execute</text><text x="755" y="183" text-anchor="middle" class="s">queue + provider</text><text x="965" y="160" text-anchor="middle" class="t">Finalize</text><text x="965" y="183" text-anchor="middle" class="s">confirm / recover</text><path d="M205 165H255M415 165H465M625 165H675M835 165H885" class="a"/><text x="255" y="285" class="s">A retry resolves to the durable operation rather than creating another transfer.</text><text x="255" y="315" class="s">Ambiguous failures remain visible for reconciliation or manual review.</text></svg>