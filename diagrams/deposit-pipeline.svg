<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400"><style>text{font-family:Arial;fill:#111827}.t{font-size:21px;font-weight:bold}.s{font-size:14px}.b{fill:#f8fafc;stroke:#64748b;stroke-width:2}.a{stroke:#334155;stroke-width:2}</style><text x="45" y="45" class="t">Deposit Ingestion &amp; Delivery</text><g class="b"><rect x="35" y="130" width="150" height="70" rx="10"/><rect x="225" y="130" width="150" height="70" rx="10"/><rect x="415" y="130" width="150" height="70" rx="10"/><rect x="605" y="130" width="150" height="70" rx="10"/><rect x="795" y="130" width="150" height="70" rx="10"/><rect x="985" y="130" width="170" height="70" rx="10"/></g><text x="110" y="160" text-anchor="middle" class="t">Chain Event</text><text x="110" y="183" text-anchor="middle" class="s">webhook / poll</text><text x="300" y="160" text-anchor="middle" class="t">Normalize</text><text x="300" y="183" text-anchor="middle" class="s">stable identity</text><text x="490" y="160" text-anchor="middle" class="t">Persist</text><text x="490" y="183" text-anchor="middle" class="s">confirmed state</text><text x="680" y="160" text-anchor="middle" class="t">Outbox</text><text x="680" y="183" text-anchor="middle" class="s">durable delivery</text><text x="870" y="160" text-anchor="middle" class="t">Signed Send</text><text x="870" y="183" text-anchor="middle" class="s">retry-safe</text><text x="1070" y="160" text-anchor="middle" class="t">Main App</text><text x="1070" y="183" text-anchor="middle" class="s">idempotent ingest</text><path d="M185 165H225M375 165H415M565 165H605M755 165H795M945 165H985" class="a"/><text x="225" y="285" class="s">Remote delivery failure does not erase a confirmed blockchain event.</text><text x="225" y="315" class="s">Reconciliation can repair delivery state without duplicating the deposit.</text></svg>